# Retained as a manual notice for callers of the former wiki mirror.
# The profile is curated; the full catalog remains in the organization wiki.
name: Profile editorial policy (wiki mirror retired)

on:
  workflow_dispatch:

permissions: {}

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Explain profile ownership
        run: echo "Edit profile/README.md through a reviewed change. The wiki catalog is linked, not mirrored."
